services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evalobs
      POSTGRES_PASSWORD: evalobs
      POSTGRES_DB: evalobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalobs"]
      interval: 2s
      timeout: 5s
      retries: 10

  otel-collector:
    # ``contrib`` distribution ships the file exporter we use to introspect
    # spans from CI. The vanilla ``opentelemetry-collector`` does not.
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./infra/collector-data:/data
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"

volumes:
  pgdata:
