services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evalobs
      POSTGRES_PASSWORD: evalobs
      POSTGRES_DB: evalobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalobs"]
      interval: 2s
      timeout: 5s
      retries: 10

  otel-collector:
    # ``contrib`` distribution ships extra exporters and the same ``debug``
    # exporter the CI ``otel-smoke`` job greps for in stdout. The vanilla
    # ``opentelemetry-collector`` would also work for the smoke path; we
    # default to the contrib image because it's what most production
    # platforms run.
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"

volumes:
  pgdata:
