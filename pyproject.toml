[tool.poetry]
name = "eval-observability"
version = "0.1.0"
description = "LLM eval framework with OpenTelemetry tracing, structured logs, and Welch's t-test regression detection"
authors = ["Sai Asish Y"]
license = "MIT"
readme = "README.md"
packages = [{ include = "eval_observability", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
click = "^8.1.7"
sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
psycopg = { version = "^3.2.1", extras = ["binary"] }
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp = "^1.27.0"
structlog = "^24.4.0"
pyyaml = "^6.0.2"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
apscheduler = "^3.10.4"
rich = "^13.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
mypy = "^1.11.2"
ruff = "^0.6.8"
black = "^24.8.0"
scipy = "^1.14.1"
types-pyyaml = "^6.0.12"
pre-commit = "^3.8.0"
hypothesis = "^6.112.1"
faker = "^28.0.0"

[tool.poetry.scripts]
eval-obs = "eval_observability.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PL"]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0915",
    "PLW0603",
    "PLW0602",
    "PLC0415",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "E501"]
"src/eval_observability/providers/fake.py" = ["E501"]
"src/eval_observability/providers/_synth_answers.py" = ["E501"]
"eval/synth/synthesize.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/eval_observability"]
plugins = []

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "scipy.*",
    "opentelemetry.exporter.otlp.proto.grpc.*",
    "hypothesis.*",
    "faker.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/eval_observability"]
# Branch coverage is disabled because Hypothesis 6.150+ may execute reduced
# failing test cases in a child Python process where ``coverage`` re-attaches
# without the parent's branch flag, causing ``coverage combine`` to fail with
# "Can't combine statement coverage data with branch data". Statement coverage
# is sufficient for the CI gate; per-branch data is available locally by
# unsetting this flag and disabling property tests.
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
