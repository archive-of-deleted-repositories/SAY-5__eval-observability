name: instruction_following
version: core_v1
description: Multi-constraint instructions; structural assertions on the JSON output.
examples:
- id: instruction_following-1
  input: Reply with a JSON object having keys A (string), B (string with exactly 3
    sentences), and C (integer).
  gold:
    json_only: true
    required_keys:
    - A
    - B
    - C
    sentence_count:
      B: 3
    value_types:
      A: str
      C: int
