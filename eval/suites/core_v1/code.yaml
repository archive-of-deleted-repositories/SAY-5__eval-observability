name: code
version: core_v1
description: Implement small Python functions; pytest tests are the gold standard.
examples:
- id: code-1
  input: "def add(a: int, b: int) -> int:\n    \"\"\"Return a + b.\"\"\"\n"
  gold:
    function_name: add
    tests: "def test_basic():\n    assert add(1, 2) == 3\n    assert add(0, 0) ==\
      \ 0\n    assert add(-1, 1) == 0\ndef test_neg():\n    assert add(-5, -7) ==\
      \ -12\n"
- id: code-2
  input: "def is_even(n: int) -> bool:\n    \"\"\"Return True if n is even.\"\"\"\n"
  gold:
    function_name: is_even
    tests: "def test_even():\n    assert is_even(0) is True\n    assert is_even(2)\
      \ is True\n    assert is_even(4) is True\ndef test_odd():\n    assert is_even(1)\
      \ is False\n    assert is_even(7) is False\n"
- id: code-3
  input: "def reverse_string(s: str) -> str:\n    \"\"\"Return s reversed.\"\"\"\n"
  gold:
    function_name: reverse_string
    tests: "def test_basic():\n    assert reverse_string(\"abc\") == \"cba\"\n   \
      \ assert reverse_string(\"\") == \"\"\n    assert reverse_string(\"a\") == \"\
      a\"\ndef test_palindrome():\n    assert reverse_string(\"level\") == \"level\"\
      \n"
- id: code-4
  input: "def factorial(n: int) -> int:\n    \"\"\"Return n! for n >= 0.\"\"\"\n"
  gold:
    function_name: factorial
    tests: "def test_small():\n    assert factorial(0) == 1\n    assert factorial(1)\
      \ == 1\n    assert factorial(5) == 120\ndef test_larger():\n    assert factorial(7)\
      \ == 5040\n"
- id: code-5
  input: "def max_of_list(xs: list[int]) -> int:\n    \"\"\"Return the maximum value\
    \ of xs.\"\"\"\n"
  gold:
    function_name: max_of_list
    tests: "def test_basic():\n    assert max_of_list([1, 2, 3]) == 3\n    assert\
      \ max_of_list([-1, -2, -3]) == -1\n    assert max_of_list([42]) == 42\n"
- id: code-6
  input: "def fib(n: int) -> int:\n    \"\"\"Return the n-th Fibonacci number; fib(0)=0,\
    \ fib(1)=1.\"\"\"\n"
  gold:
    function_name: fib
    tests: "def test_base():\n    assert fib(0) == 0\n    assert fib(1) == 1\ndef\
      \ test_recurrence():\n    assert fib(2) == 1\n    assert fib(5) == 5\n    assert\
      \ fib(10) == 55\n"
- id: code-7
  input: "def count_vowels(s: str) -> int:\n    \"\"\"Count a/e/i/o/u (case-insensitive)\
    \ in s.\"\"\"\n"
  gold:
    function_name: count_vowels
    tests: "def test_basic():\n    assert count_vowels(\"hello\") == 2\n    assert\
      \ count_vowels(\"AEIOU\") == 5\n    assert count_vowels(\"xyz\") == 0\n    assert\
      \ count_vowels(\"\") == 0\n"
- id: code-8
  input: "def is_palindrome(s: str) -> bool:\n    \"\"\"Return True if s reads the\
    \ same forwards and backwards (case-insensitive).\"\"\"\n"
  gold:
    function_name: is_palindrome
    tests: "def test_basic():\n    assert is_palindrome(\"level\") is True\n    assert\
      \ is_palindrome(\"Racecar\") is True\n    assert is_palindrome(\"hello\") is\
      \ False\n    assert is_palindrome(\"\") is True\n"
- id: code-9
  input: "def gcd(a: int, b: int) -> int:\n    \"\"\"Return the greatest common divisor\
    \ of a and b.\"\"\"\n"
  gold:
    function_name: gcd
    tests: "def test_basic():\n    assert gcd(12, 8) == 4\n    assert gcd(100, 75)\
      \ == 25\n    assert gcd(7, 7) == 7\n    assert gcd(13, 1) == 1\n"
- id: code-10
  input: "def flatten(xs: list) -> list:\n    \"\"\"Flatten a list one level deep,\
    \ preserving order.\"\"\"\n"
  gold:
    function_name: flatten
    tests: "def test_basic():\n    assert flatten([[1, 2], [3, 4]]) == [1, 2, 3, 4]\n\
      \    assert flatten([[], [1]]) == [1]\n    assert flatten([]) == []\n"
- id: code-syn-001
  input: "def halve_int(n: int) -> int:\n    \"\"\"Return n // 2.\"\"\"\n"
  gold:
    function_name: halve_int
    tests: "def test_basic():\n    assert halve_int(0) == 0\n    assert halve_int(4)\
      \ == 2\n    assert halve_int(7) == 3\n"
