receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
  debug:
    verbosity: detailed
  # File exporter writes received spans as newline-delimited JSON. The CI
  # ``otel-smoke`` job mounts a host directory at ``/data`` and reads
  # ``spans.jsonl`` to assert the collector saw the expected span tree.
  file:
    path: /data/spans.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug, file]
